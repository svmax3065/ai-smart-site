name: Verify report management
on:
  push:
    paths:
      - 'report-management-v1.js'
      - 'index.html'
      - '.github/workflows/verify-report-management.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check report-management-v1.js
      - name: Check report manager loads before app
        run: |
          grep -q 'report-management-v1.js?v=1' index.html
          python - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          assert s.index('report-management-v1.js?v=1') < s.index('app-v2.js')
          print('report manager load order ok')
          PY
      - name: Check required edit/delete protections
        run: |
          grep -q "update_report" report-management-v1.js
          grep -q "soft_delete_report" report-management-v1.js
          grep -q "filter(x=>!x.deleted_at)" report-management-v1.js
          grep -q "翻譯五組驗證未通過" report-management-v1.js