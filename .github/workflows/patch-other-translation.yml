name: Patch translation safety
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce verification for Other work
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const otherText=document.getElementById('other')?.value||'';if(task.value==='other'&&!otherText.trim())return alert('請填寫其他工作內容');const files="
          new="const otherText=document.getElementById('other')?.value||'';if(task.value==='other'&&!otherText.trim())return alert('請填寫其他工作內容');let otherTranslation=null;if(task.value==='other'){const tj=await call('translate_verify',{text:otherText.trim(),source_language:lang==='vi'?'vi-VN':'zh-TW'});otherTranslation=tj.translation;if(otherTranslation.status!=='verified')return alert('其他工作內容翻譯未通過，請修改後再送出')}const files="
          if old not in s: raise SystemExit('target not found')
          s=s.replace(old,new,1)
          old2="other_work:otherText||null,work_location:"
          new2="other_work:otherText||null,other_work_translation_id:otherTranslation?.id||null,work_location:"
          if old2 not in s: raise SystemExit('payload target not found')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Enforce verified translation for Other work"
          git push
