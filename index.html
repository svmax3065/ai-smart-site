<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><title>磐築｜工地打卡管理</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f6f8;color:#111827}.top{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:18px}.wrap{max-width:920px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.big{padding:22px 12px;border:0;border-radius:14px;background:#e5e7eb;font-size:17px;font-weight:800}.big.done{background:#d1fae5}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.ghost{background:#fff;color:#111827}.good{background:#d1fae5}.bad{background:#fee2e2}.warn{background:#fef3c7}.notice{padding:10px;border-radius:10px;background:#f3f4f6;margin:8px 0}.muted{color:#6b7280;font-size:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}label{display:block;font-weight:800;margin:9px 0 5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:13px}.photo{width:94px;height:74px;object-fit:cover;border-radius:8px}.hidden{display:none}h2,h3{margin:4px 0 10px}@media(max-width:600px){.wrap{padding:8px}.card{padding:13px}.top b{font-size:16px}}</style></head><body><div class="top"><b>🏗️ 磐築｜工地打卡</b><div class="row"><button class="btn ghost" id="langBtn">Tiếng Việt</button><button class="btn ghost hidden" id="logoutBtn">登出</button></div></div><main class="wrap" id="app"></main><script>
const BASE='https://unjcndjviwzshbqoapgx.supabase.co/functions/v1',API=BASE+'/attendance-api',ADM=BASE+'/attendance-admin';let token=localStorage.getItem('sp_token')||'',actor=JSON.parse(localStorage.getItem('sp_actor')||'null'),boot=null,lang=localStorage.getItem('sp_lang')||'zh';const T={zh:{employee:'員工',boss:'老闆',login:'登入',name:'姓名',pin:'4位 PIN',pass:'老闆密碼',morning:'早上到場',noon:'中午回報',evening:'下班回報',site:'工程地點',task:'工作項目',area:'工作位置',note:'備註',photos:'照片',send:'送出回報',tools:'工具',borrow:'領用',return:'歸還',dashboard:'老闆後台',addEmp:'新增員工',addSite:'新增工地',addTool:'新增工具',logout:'登出',translate:'翻譯驗證',verified:'翻譯驗證通過',manual:'需人工確認',failed:'翻譯驗證失敗',gps:'GPS',today:'今日回報'},vi:{employee:'Nhân viên',boss:'Quản lý',login:'Đăng nhập',name:'Tên',pin:'PIN 4 số',pass:'Mật khẩu quản lý',morning:'Báo cáo sáng',noon:'Báo cáo trưa',evening:'Báo cáo tan ca',site:'Công trường',task:'Công việc',area:'Vị trí làm việc',note:'Ghi chú',photos:'Hình ảnh',send:'Gửi báo cáo',tools:'Dụng cụ',borrow:'Mượn',return:'Trả',dashboard:'Trang quản lý',addEmp:'Thêm nhân viên',addSite:'Thêm công trường',addTool:'Thêm dụng cụ',logout:'Đăng xuất',translate:'Kiểm tra bản dịch',verified:'Bản dịch đã xác minh',manual:'Cần xác nhận thủ công',failed:'Bản dịch không đạt',gps:'GPS',today:'Báo cáo hôm nay'}};const tr=k=>T[lang][k]||k,app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,body={},admin=false){const r=await fetch(admin?ADM:API,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'系統錯誤');return j}async function callForm(fd){const r=await fetch(API,{method:'POST',headers:{authorization:'Bearer '+token},body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||'上傳失敗');return j}
function saveSession(j,type){token=j.token;actor={type,...j.actor};localStorage.setItem('sp_token',token);localStorage.setItem('sp_actor',JSON.stringify(actor))}function clearSession(){localStorage.removeItem('sp_token');localStorage.removeItem('sp_actor');token='';actor=null}function setTop(){document.getElementById('langBtn').textContent=lang==='zh'?'Tiếng Việt':'中文';const l=document.getElementById('logoutBtn');l.classList.toggle('hidden',!token);l.textContent=tr('logout')}document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'vi':'zh';localStorage.setItem('sp_lang',lang);render()};document.getElementById('logoutBtn').onclick=async()=>{try{await call('logout')}catch{}clearSession();render()};
async function render(){setTop();if(!token||!actor)return login();try{boot=await call('bootstrap');return actor.type==='admin'?boss():employee()}catch(e){clearSession();login()}}async function login(){const p=await call('public_bootstrap').catch(()=>({employees:[]}));app.innerHTML='<div class="card"><div class="row"><button class="btn primary" id="empTab">'+tr('employee')+'</button><button class="btn" id="bossTab">'+tr('boss')+'</button></div><div id="box"></div></div>';const box=document.getElementById('box');function emp(){box.innerHTML='<label>'+tr('name')+'</label><select id="eid">'+(p.employees.length?p.employees.map(e=>'<option value="'+e.id+'">'+esc(lang==='vi'&&e.name_vi?e.name_vi:e.name_zh)+'</option>').join(''):'<option>尚未建立員工</option>')+'</select><label>'+tr('pin')+'</label><input id="pin" inputmode="numeric" maxlength="4"><button class="btn primary" style="width:100%;margin-top:12px" id="go">'+tr('login')+'</button>';document.getElementById('go').onclick=async()=>{try{const j=await call('employee_login',{employee_id:document.getElementById('eid').value,pin:document.getElementById('pin').value});saveSession(j,'employee');render()}catch(e){alert(e.message)}}}function bos(){box.innerHTML='<label>'+tr('pass')+'</label><input id="pass" type="password"><button class="btn primary" style="width:100%;margin-top:12px" id="go">'+tr('login')+'</button>';document.getElementById('go').onclick=async()=>{try{const j=await call('admin_login',{password:document.getElementById('pass').value});saveSession(j,'admin');render()}catch(e){alert(e.message)}}}document.getElementById('empTab').onclick=emp;document.getElementById('bossTab').onclick=bos;emp()}
const periodLabel=p=>tr(p);async function employee(){const td=await call('my_today').catch(()=>({reports:[]})),done=p=>td.reports.some(r=>r.period===p);app.innerHTML='<div class="card"><h2>'+esc(actor.name_zh||actor.name_vi||tr('employee'))+'</h2><div class="grid">'+['morning','noon','evening'].map(p=>'<button class="big '+(done(p)?'done':'')+'" data-p="'+p+'">'+periodLabel(p)+(done(p)?' ✅':'')+'</button>').join('')+'</div></div><div class="card"><h3>'+tr('today')+'</h3>'+td.reports.map(r=>'<div class="notice '+(r.outside_radius?'bad':'')+'"><b>'+periodLabel(r.period)+' · '+esc(r.sites?.name||'')+'</b><div>'+esc((boot.work_types.find(x=>x.code===r.work_type)||{})[lang==='vi'?'label_vi':'label_zh']||r.work_type)+'</div><div class="muted">'+new Date(r.reported_at).toLocaleString()+'</div><div class="row">'+(r.photos||[]).map(p=>p.url?'<img class="photo" src="'+p.url+'">':'').join('')+'</div></div>').join('')+'</div><div class="card"><h3>'+tr('tools')+'</h3><div id="toolbox"></div></div><div id="form"></div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>reportForm(b.dataset.p));toolBox()}
function toolBox(){document.getElementById('toolbox').innerHTML=(boot.tools||[]).map(t=>'<div class="notice"><b>'+esc(t.name)+'</b> · '+t.total_qty+' <button class="btn" onclick="borrowTool(\''+t.id+'\')">'+tr('borrow')+'</button></div>').join('')+(boot.open_loans||[]).map(l=>'<div class="notice good">'+esc(l.tools?.name||'')+' × '+l.qty+' <button class="btn" onclick="returnTool(\''+l.id+'\')">'+tr('return')+'</button></div>').join('')}window.borrowTool=async id=>{if(!boot.sites.length)return alert('尚未建立工地');const site=prompt(tr('site')+' ID：\n'+boot.sites.map(s=>s.name+' = '+s.id).join('\n'));if(!site)return;const qty=Number(prompt('數量','1'));try{await call('tool_checkout',{tool_id:id,site_id:site,qty});render()}catch(e){alert(e.message)}};window.returnTool=async id=>{try{await call('tool_return',{loan_id:id});render()}catch(e){alert(e.message)}};
function reportForm(period){if(!boot.sites.length)return alert('請老闆先建立工地');document.getElementById('form').innerHTML='<div class="card"><h3>'+periodLabel(period)+'</h3><label>'+tr('site')+'</label><select id="site">'+boot.sites.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><label>'+tr('task')+'</label><select id="task">'+boot.work_types.map(w=>'<option value="'+w.code+'">'+esc(lang==='vi'?w.label_vi:w.label_zh)+'</option>').join('')+'</select><div id="otherBox"></div><label>'+tr('area')+'</label><input id="area"><label>'+tr('note')+'</label><textarea id="note" rows="3"></textarea><button class="btn" id="verify">↔ '+tr('translate')+'</button><div id="trans"></div><label>'+tr('photos')+'（最多8張）</label><input id="photos" type="file" accept="image/*" multiple><div class="notice" id="gps">'+tr('gps')+'：尚未取得</div><button class="btn primary" style="width:100%" id="send">'+tr('send')+'</button></div>';const task=document.getElementById('task'),other=document.getElementById('otherBox');task.onchange=()=>other.innerHTML=task.value==='other'?'<label>其他 / Khác</label><input id="other">':'';task.onchange();let translation=null;document.getElementById('verify').onclick=async()=>{const text=document.getElementById('note').value.trim();if(!text)return alert('請先輸入備註');try{const j=await call('translate_verify',{text,source_language:lang==='vi'?'vi-VN':'zh-TW'});translation=j.translation;document.getElementById('trans').innerHTML='<div class="notice '+(translation.status==='verified'?'good':translation.status==='failed'?'bad':'warn')+'"><b>'+(translation.status==='verified'?tr('verified'):translation.status==='failed'?tr('failed'):tr('manual'))+'</b><div>→ '+esc(translation.translated_text)+'</div><div>↩ '+esc(translation.back_translated_text)+'</div><div class="muted">score '+Math.round(Number(translation.semantic_score||0)*100)+'%</div></div>'}catch(e){alert(e.message)}};let pos=null;navigator.geolocation?.getCurrentPosition(p=>{pos=p.coords;document.getElementById('gps').textContent='GPS：'+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)+' ±'+Math.round(p.coords.accuracy)+'m'},()=>{document.getElementById('gps').textContent='GPS：取得失敗，仍可回報'},{enableHighAccuracy:true,timeout:10000});document.getElementById('send').onclick=async()=>{try{const note=document.getElementById('note').value.trim();if(note&&(!translation||translation.source_text!==note))return alert('自由輸入備註需先完成雙向翻譯驗證');if(translation?.status!=='verified')return alert('翻譯未通過，請修改文字後重新驗證');const otherText=document.getElementById('other')?.value||'';if(task.value==='other'&&!otherText.trim())return alert('請填寫其他工作內容');let otherTranslation=null;if(task.value==='other'){const tj=await call('translate_verify',{text:otherText.trim(),source_language:lang==='vi'?'vi-VN':'zh-TW'});otherTranslation=tj.translation;if(otherTranslation.status!=='verified')return alert('其他工作內容翻譯未通過，請修改後再送出')}const files=[...document.getElementById('photos').files];if(files.length>8)return alert('照片最多8張');const j=await call('create_report',{client_id:crypto.randomUUID(),period,site_id:document.getElementById('site').value,work_type:task.value,other_work:otherText||null,other_work_translation_id:otherTranslation?.id||null,work_location:document.getElementById('area').value,note:note||null,note_translation_id:translation?.id||null,device_time:new Date().toISOString(),latitude:pos?.latitude,longitude:pos?.longitude,gps_accuracy_m:pos?.accuracy});for(const f of files){const fd=new FormData();fd.append('action','upload_photo');fd.append('report_id',j.report.id);fd.append('photo',f,f.name);await callForm(fd)}alert('✅ 已同步');render()}catch(e){alert(e.message)}}}
async function boss(){const d=await call('admin_dashboard');app.innerHTML='<div class="card"><h2>'+tr('dashboard')+'</h2><div class="grid"><div class="notice">員工 <b>'+d.employees.length+'</b>/10</div><div class="notice">回報 <b>'+d.reports.length+'</b></div><div class="notice">工具未歸還 <b>'+d.open_loans.length+'</b></div></div><div class="row"><button class="btn" id="ae">＋ '+tr('addEmp')+'</button><button class="btn" id="as">＋ '+tr('addSite')+'</button><button class="btn" id="at">＋ '+tr('addTool')+'</button><button class="btn" id="cp">修改密碼</button></div></div><div class="card"><h3>今日人員狀態</h3>'+d.employees.map(e=>{const rs=d.reports.filter(r=>r.employee_id===e.id);return '<div class="notice"><b>'+esc(e.name_zh)+'</b><div class="row">'+['morning','noon','evening'].map(p=>'<span class="pill">'+periodLabel(p)+' '+(rs.some(r=>r.period===p)?'✅':'—')+'</span>').join('')+'</div></div>'}).join('')+'</div><div class="card"><h3>今日回報</h3>'+d.reports.map(r=>'<div class="notice '+(r.outside_radius?'bad':'')+'"><b>'+esc(r.employees?.name_zh||'')+' · '+esc(r.sites?.name||'')+' · '+periodLabel(r.period)+'</b><div>'+esc((boot.work_types.find(x=>x.code===r.work_type)||{}).label_zh||r.work_type)+' · '+esc(r.work_location||'')+'</div><div>'+esc(r.note||'')+'</div>'+(r.translations?'<div class="muted">翻譯：'+esc(r.translations.translated_text||'')+'｜回譯：'+esc(r.translations.back_translated_text||'')+'</div>':'')+'<div class="muted">'+new Date(r.reported_at).toLocaleString()+(r.distance_m!=null?' · 距工地 '+Math.round(r.distance_m)+'m':'')+'</div><div class="row">'+(r.photos||[]).map(p=>p.url?'<a href="'+p.url+'" target="_blank"><img class="photo" src="'+p.url+'"></a>':'').join('')+'</div></div>').join('')+'</div><div class="card"><h3>工具未歸還</h3>'+d.open_loans.map(l=>'<div class="notice">'+esc(l.employees?.name_zh||'')+' · '+esc(l.tools?.name||'')+' × '+l.qty+' · '+esc(l.sites?.name||'')+'</div>').join('')+'</div>';document.getElementById('ae').onclick=addEmp;document.getElementById('as').onclick=addSite;document.getElementById('at').onclick=addTool;document.getElementById('cp').onclick=changePass}
async function admin(action,body={}){return call(action,body,true)}async function addEmp(){const n=prompt('中文姓名');if(!n)return;const v=prompt('越南文姓名（可留空）')||'',p=prompt('4位 PIN');if(!/^\d{4}$/.test(p||''))return alert('PIN 必須4位數');try{await admin('create_employee',{name_zh:n,name_vi:v,pin:p,language:v?'vi-VN':'zh-TW'});render()}catch(e){alert(e.message)}}async function addSite(){const n=prompt('工地名稱');if(!n)return;const addr=prompt('地址（可留空）')||'',lat=prompt('緯度（可留空，之後可補）')||'',lon=prompt('經度（可留空）')||'',r=Number(prompt('GPS半徑（公尺）','100'));try{await admin('create_site',{name:n,address:addr,latitude:lat===''?null:Number(lat),longitude:lon===''?null:Number(lon),radius_m:r});render()}catch(e){alert(e.message)}}async function addTool(){const n=prompt('工具名稱');if(!n)return;const q=Number(prompt('總數量','1'));try{await admin('create_tool',{name:n,total_qty:q});render()}catch(e){alert(e.message)}}async function changePass(){const o=prompt('目前密碼');if(!o)return;const n=prompt('新密碼（至少10碼）');if(!n)return;try{await admin('change_password',{old_password:o,new_password:n});alert('密碼已變更，請重新登入');clearSession();render()}catch(e){alert(e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
